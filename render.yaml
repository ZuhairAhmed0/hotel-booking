services:
  - type: web
    name: iqama-hotel-booking
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: base64:wlWvcaADEomFbuBoQSMuzWUD20tpdFm8+5FksUPAltg=
      - key: DB_CONNECTION
        value: sqlite
      - key: LOG_CHANNEL
        value: stderr
